<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Bookstore{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#content">Skip to content</a>
    {% include "includes/navigation.html" %}
    <main id="content" class="container">
        {% include "includes/messages.html" %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">Online Bookstore &middot; a Software Engineering mini project</div>
    </footer>
</body>
</html>
