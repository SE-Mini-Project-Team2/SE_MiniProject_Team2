<nav aria-label="Main navigation">
    <p><a href="{% url 'home' %}">Home</a></p>
    <p><a href="{% url 'books:list' %}">Browse Books</a></p>

    <form action="{% url 'books:search' %}" method="get">
        <label for="site-book-search">Search books by title or author:</label>
        <input
            id="site-book-search"
            type="text"
            name="q"
            maxlength="100"
            value="{{ request.GET.q }}"
            placeholder="Enter book title or author"
        >
        <button type="submit">Search Books</button>
    </form>

    {% if user.is_authenticated %}
        {% if user.role == "CUSTOMER" %}
            <p><a href="{% url 'cart:view_cart' %}">My Cart</a></p>
            <p><a href="{% url 'orders:history' %}">My Orders</a></p>
        {% elif user.role == "SELLER" %}
            <p><a href="{% url 'books:add' %}">Add a Book Listing</a></p>
        {% endif %}

        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
    {% else %}
        <p><a href="{% url 'accounts:login' %}">Log In</a></p>
        <p><a href="{% url 'accounts:register' %}">Create an Account</a></p>
    {% endif %}
</nav>
