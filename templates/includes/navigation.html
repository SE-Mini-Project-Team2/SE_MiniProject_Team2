<header class="site-header">
    <div class="container header-row">
        <a class="brand" href="{% url 'home' %}"><span class="brand-mark" aria-hidden="true"></span>Online Bookstore</a>

        <form class="site-search" action="{% url 'books:search' %}" method="get" role="search">
            <label class="sr-only" for="site-book-search">Search books by title or author:</label>
            <input
                id="site-book-search"
                type="text"
                name="q"
                maxlength="100"
                value="{{ request.GET.q }}"
                placeholder="Enter book title or author"
            >
            <button type="submit">Search Books</button>
        </form>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'books:list' %}">Browse Books</a>

            {% if user.is_authenticated %}
                {% if user.role == "CUSTOMER" %}
                    <a href="{% url 'cart:view_cart' %}">My Cart</a>
                    <a href="{% url 'orders:history' %}">My Orders</a>
                {% elif user.role == "SELLER" %}
                    <a href="{% url 'books:my_listings' %}">My Listings</a>
                    <a href="{% url 'books:add' %}">Add a Book Listing</a>
                {% endif %}

                <form class="nav-form" method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="btn-ghost" type="submit">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Log In</a>
                <a class="nav-cta" href="{% url 'accounts:register' %}">Create an Account</a>
            {% endif %}
        </nav>
    </div>
</header>
