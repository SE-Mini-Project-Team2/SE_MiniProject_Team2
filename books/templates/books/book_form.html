{% extends "base.html" %}
{% block title %}Add a Book{% endblock %}
{% block content %}
<section class="auth-card wide">
    <h1>Add a Book Listing</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        {{ form.non_field_errors }}
        <div class="form-actions">
            <button type="submit">Add Book</button>
            <a class="btn btn-quiet" href="{% url 'books:list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
